name: Diagnose unit tests

# Reads the failing case names from the unit suite on the runner that reports
# the failure, without an authenticated log download. Each failing case is
# emitted as a workflow error so it appears in the public check-run annotations.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@10.13.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report failing cases
        if: always()
        run: |
          set +e
          node --experimental-transform-types --test --test-reporter=tap "tests/unit/*.test.mjs" > unit.tap 2>&1
          status=$?
          echo "exit status: $status"
          # Emit each failing case and its assertion detail as an annotation.
          awk '/^not ok/{name=$0} /^ *error: /{print name " || " $0}' unit.tap | head -40 | while IFS= read -r line; do
            echo "::error title=unit failure::$line"
          done
          # The assertion that failed, for each failing case.
          awk '/^# Subtest: /{case=$0} /AssertionError|Expected values|actual:|expected:|operator:|at .*test\.mjs/{print case " >> " $0}' unit.tap | head -80 | while IFS= read -r line; do
            echo "::error title=unit assertion::$line"
          done
          exit 0
