name: Diagnose unit tests

# Reads the failing case names and their assertion detail from the unit suite on
# the runner that reports the failure, without an authenticated log download.
# Every line of the failing files' output is re-emitted as a workflow error, so
# the annotation list carries the assertion text.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@10.13.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run each unit file separately
        if: always()
        run: |
          set +e
          for file in tests/unit/*.test.mjs; do
            node --experimental-transform-types --test "$file" > single.log 2>&1
            status=$?
            if [ $status -ne 0 ]; then
              echo "::error title=failed file::$file (exit $status)"
              # Emit the failing assertion lines for this file.
              grep -E "✖|AssertionError|expected|actual|Error|at file" single.log | head -30 | while IFS= read -r line; do
                echo "::error title=$file::$line"
              done
            fi
          done
          exit 0
