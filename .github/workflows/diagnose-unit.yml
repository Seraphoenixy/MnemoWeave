name: Diagnose unit tests

# Reads the failing case names and their assertion detail from the unit suite on
# the runner that reports the failure, without an authenticated log download.
# Failing blocks are printed to stderr and re-emitted as workflow errors so they
# appear in the public check-run annotations.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@10.13.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report failing cases
        if: always()
        run: |
          set +e
          node --experimental-transform-types --test --test-reporter=tap "tests/unit/*.test.mjs" > unit.tap 2>&1
          echo "exit status: $?"
          # Print each failing case's block, from its `not ok` line to the next
          # top-level result, so the assertion text is visible.
          awk '/^not ok [0-9]+ - tests\//{printing=1} printing{print} /^ok [0-9]+ - tests\//{printing=0}' unit.tap \
            | grep -v '^#' | head -120 > failed.txt
          cat failed.txt
          head -c 3000 failed.txt | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=unit failure::$line"
          done
          exit 0
