# Bundle layer: DSH loads this file automatically when dsh-mnemo-weave is enabled.
# Do NOT copy its insert block into the profile's cordis.patch.yml: doing so
# duplicates entry IDs and prevents Settings from saving (issue #470).
# Keep profile overrides as top-level - id: mnemon rows. See the installation
# guide's "Settings cannot save after manual installation" recovery steps.
- insert:
    # Keep the v0.4 `mnemon` Entry as the public configuration target while
    # making every v0.5 component inherit its enabled state. The expression
    # reads the core row's own flag (rather than its effective state) to avoid
    # recursing through this ancestor gate. The group itself prepares the
    # Starter's dependency resolution before it imports its children.
    - id: mnemon-bundle
      name: dsh-mnemo-weave/bundle
      group: true
      disabled: !!js >-
        ((entry) => entry.options.disabled?.__jsExpr
          ? Boolean(entry.evaluate(entry.options.disabled.__jsExpr))
          : Boolean(entry.options.disabled))
        ([...loader.entries()].find(entry => entry.options.id === 'mnemon'))
      config:
        - id: mnemon
          # Core/Host and default settings. Sources own their independent Entries.
          name: dsh-mnemo-weave
          config:
            routingGuidance: true
            lifecycleEnabled: true
            recallMode: guided
            writebackMode: guided
            idleReviewMs: 30000
            tabEnabled: true
            writeEnabled: true
            remoteAccess: read-only
            timeoutMs: 10000
            defaultRecallLimit: 10
            embedding:
              enabled: false
              endpoint: http://localhost:11434
              model: nomic-embed-text
            recallQuality:
              policy: strict-v1
              lowScoreThreshold: 0.25
              highScoreThreshold: 0.6
              candidateMultiplier: 3
              maxMediumResults: 4
              maxRankedResults: 4
              maxUnknownResults: 2
        - id: mnemon-source-runtime
          name: dsh-mnemo-weave/source-runtime
          group: true
        - id: mnemon-source-documents
          name: dsh-mnemo-weave/source-documents
          group: true
        - id: mnemon-source-memory-spaces
          name: dsh-mnemo-weave/source-memory-spaces
          group: true
          config:
            # The only Provider this project supports.
            providers:
              - use: dsh-mnemo-weave/provider/mnemon-native
                instanceId: mnemon-native
        # Skills keep DSH's own files and their evolution data; the page lives
        # in the Memory System and nothing joins a model View.
        - id: mnemon-source-skills
          name: dsh-mnemo-weave/source-skills
          group: true
        # v0.5 ships this enhancement with the Starter so the Settings switch is
        # always available. It remains opt-in.
        - id: mnemon-strategy-auto-capture
          name: dsh-mnemo-weave/strategy-auto-capture
          group: true
          disabled: true
# The plugin inventory reads the insert declarations and skips groups. Keep
# the component IDs in those declarations so profile patches can address them,
# then mount them as ordinary entries when the full patch is applied.
- id: mnemon-source-runtime
  group: false
- id: mnemon-source-documents
  group: false
- id: mnemon-source-memory-spaces
  group: false
- id: mnemon-source-skills
  group: false
- id: mnemon-strategy-auto-capture
  group: false
