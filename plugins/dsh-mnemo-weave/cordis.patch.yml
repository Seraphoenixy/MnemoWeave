
# Bundle layer: DSH loads this file when the plugin bundle is enabled.
# The service token stays in the host environment (MNEMOWEAVE_TOKEN); no secrets in this file.
- insert:
    # Prompt-time View injection (skeleton; see README for its blocked state).
    - id: mnemo-weave
      name: dsh-mnemo-weave
      config:
        serverUrl: http://127.0.0.1:4317
        timeoutMs: 1900
    # Editable memory page. Its Host half calls the MnemoWeave Server directly with the
    # service token from MNEMOWEAVE_TOKEN and identifies itself through MNEMOWEAVE_HOST_ID.
    - id: mnemo-weave-ui
      name: dsh-mnemo-weave/ui
      config:
        serverUrl: http://127.0.0.1:4317
