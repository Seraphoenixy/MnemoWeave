
# Bundle layer: DSH loads this file when the plugin bundle is enabled.
# Token stays in the host environment (MNEMOWEAVE_TOKEN / MNEMOWEAVE_BRIDGE_UI_TOKEN);
# no secrets in this file.
- insert:
    # Prompt-time View injection (skeleton; see README for its blocked state).
    - id: mnemo-weave
      name: dsh-mnemo-weave
      config:
        serverUrl: http://127.0.0.1:4317
        timeoutMs: 1900
    # Read-only memory page. Its Host half serves the RPC the sidebar page calls;
    # the Bridge UI token is read from MNEMOWEAVE_BRIDGE_UI_TOKEN.
    - id: mnemo-weave-ui
      name: dsh-mnemo-weave/ui
      config:
        bridgeUrl: http://127.0.0.1:4319
